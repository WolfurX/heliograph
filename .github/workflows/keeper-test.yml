name: keeper-test
# Temporary: proves whether GITHUB_TOKEN can dispatch another workflow here.
# Deleted after the answer.
on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: dispatch pulse with the built-in token
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pulse -R ${{ github.repository }}
