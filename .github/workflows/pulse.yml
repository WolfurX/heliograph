name: pulse

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes; this line is the refresh interval
  workflow_dispatch:
    inputs:
      alert_test:
        description: "Run the alert step against the critical test fixture"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: python -m unittest discover -s tests
      - name: run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: python -m heliograph
      - name: publish
        run: |
          git config user.name "heliograph"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "pulse: $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          # A concurrent push (local dev work) makes this non-fast-forward.
          # The committed sqlite db is binary, so rebasing is not an option;
          # dropping one 30-minute pulse is harmless and the next run covers it.
          git push || echo "lost a push race; skipping this pulse"
      - name: alert on critical findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          scripts/alert.sh
          "${{ github.event.inputs.alert_test == 'true'
          && 'tests/fixtures/critical_snapshot.json' || 'docs/data.json' }}"

  # GitHub's cron scheduler has been observed to simply not deliver on this
  # repo (zero scheduled runs across many slots while Actions was green).
  # This job keeps the pulse alive without it: sleep one interval, dispatch
  # the next run. It retires itself as soon as a real scheduled run shows up
  # in the last 90 minutes, and refuses to run alongside another chain link,
  # so a manual dispatch can start exactly one chain and cron can end it.
  keepalive:
    needs: pulse
    if: always() && github.event_name != 'schedule'
    permissions:
      actions: write   # create the workflow_dispatch event; default token lacks it (403)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: sleep one interval, then dispatch the next pulse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          recent=$(gh run list -R ${{ github.repository }} --workflow pulse --limit 20 \
            --json event,createdAt \
            -q '[.[] | select(.event == "schedule")
                     | select(.createdAt > (now - 5400 | todate))] | length')
          if [ "$recent" != "0" ]; then
            echo "scheduler is delivering; chain retires"
            exit 0
          fi
          others=$(gh run list -R ${{ github.repository }} --workflow pulse --limit 10 \
            --json status,databaseId \
            -q '[.[] | select(.status == "queued" or .status == "in_progress")
                     | select(.databaseId != ${{ github.run_id }})] | length')
          if [ "$others" != "0" ]; then
            echo "another pulse run is live; leaving the chain to it"
            exit 0
          fi
          echo "scheduler silent; next pulse in 30 minutes"
          sleep 1800
          gh workflow run pulse -R ${{ github.repository }}
