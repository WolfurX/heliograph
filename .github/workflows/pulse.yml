name: pulse

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes; this line is the refresh interval
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tests
        run: python -m unittest discover -s tests
      - name: run
        run: python -m heliograph
      - name: publish
        run: |
          git config user.name "heliograph"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "pulse: $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git push
